/* Раскладка: одна колонка 760px, табло и карточки — отдельные объекты, остальное на поле */
:root {
  /* светлая: холодноватый светлый фон, белые карточки, графитовый текст */
  --bg: #F4F5F7; --surface: #FFFFFF; --raise: #FFFFFF; --line: #E1E3E8; --line-strong: #C9CCD3;
  --text: #15161A; --muted: #6A6E78; --accent: #FF4B1F; --accent-text: #D63C14; --accent-ink: #15161A;
  --ok: #1F9D55; --ok-ink: #FFFFFF; --shadow: 0 1px 2px rgba(20,22,30,.06), 0 8px 24px rgba(20,22,30,.06);
  --glow: rgba(255,75,31,.10);
  /* табло всегда тёмное */
  --board-bg: #121317; --board-line: #23252B; --board-text: #F3F1EC; --board-muted: #8F929A;
  --radius: 16px;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-look="dark"] {
  --bg: #0E0F12; --surface: #17181C; --raise: #1E1F24; --line: #2A2C33; --line-strong: #3A3C44;
  --text: #F2F1EE; --muted: #9295A0; --accent-text: #FF6A42; --ok: #8BE0A0; --ok-ink: #0E0F12;
  --shadow: none; --glow: rgba(255,75,31,.16); --board-bg: #08090B; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-look="system"] {
    --bg: #0E0F12; --surface: #17181C; --raise: #1E1F24; --line: #2A2C33; --line-strong: #3A3C44;
    --text: #F2F1EE; --muted: #9295A0; --accent-text: #FF6A42; --ok: #8BE0A0; --ok-ink: #0E0F12;
    --shadow: none; --glow: rgba(255,75,31,.16); --board-bg: #08090B; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 11; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 0 150px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.loading { color: var(--muted); padding-top: 40vh; text-align: center; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Линия полёта: прогресс сверху с огоньком на конце */
.progress { position: fixed; inset: env(safe-area-inset-top, 0px) 0 auto; height: 2px; background: var(--line); z-index: 10; }
.progress__bar { position: relative; height: 100%; width: 0; background: var(--accent); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.progress__bar::after { content: ""; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px 3px rgba(255,75,31,.55); }

/* Шапка */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; padding-block: 22px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 13px; color: var(--muted); }
.brand { font: 700 17px/1 var(--display); letter-spacing: -.01em; color: var(--text); white-space: nowrap; }
.brand i, .d-brand i { display: inline-block; font-style: normal; color: var(--accent); transform: translateY(-.28em) rotate(-6deg); transform-origin: left bottom; margin-left: .2em; }
.top__right { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; justify-content: flex-end; }
.top__save { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.look { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 7px 11px; font: 600 12px/1 var(--font); cursor: pointer; white-space: nowrap; }
.look:hover { color: var(--text); border-color: var(--line-strong); }
.switch { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 7px 12px; font: 600 12px/1 var(--font); cursor: pointer; white-space: nowrap; }
.switch:hover { border-color: var(--accent); }

/* Обложка */
.hero { position: relative; padding: 9vh 0 28px; }
.hero::before { content: ""; position: absolute; left: -30vw; top: -12vh; width: 90vw; height: 60vh; background: radial-gradient(closest-side, var(--glow), transparent); pointer-events: none; z-index: -1; }
.hero--short { padding-top: 6vh; }
.hero__eyebrow { font: 500 11px/1.4 var(--display); text-transform: uppercase; letter-spacing: .14em; color: var(--accent-text); margin: 0 0 16px; }
.hero h1 { font: 700 clamp(34px, 8.4vw, 64px)/1.02 var(--display); letter-spacing: -.035em; margin: 0 0 18px; text-wrap: balance; }
.hero__sub { font-size: 20px; line-height: 1.4; margin: 0 0 26px; max-width: 34ch; color: var(--text); }
.hero__meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
.hero__meta span { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.hero__meta b { color: var(--text); font-weight: 600; }
.lead { color: var(--muted); max-width: 58ch; }
.demo { font-size: 14px; color: var(--text); border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin: 0 0 20px; max-width: 56ch; }

/* Что вы получите */
.promise { margin: 8px 0 26px; }
.promise__t, .route__head, .safe__k { font: 500 11px/1.4 var(--display); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.promise__t { margin: 0 0 10px; }
.promise__row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.promise__i { background: var(--surface); padding: 16px; min-width: 0; }

    if (r.kind === "table") {
      const head = r.columns.map((c) => `<th>${esc(c)}</th>`).join("");
      const body = r.rows.map((row) => `<tr>${row.map((v) => `<td>${esc(v) || "—"}</td>`).join("")}</tr>`).join("");
      return `<div class="d-tw"><table class="d-sub"><tr>${head}</tr>${body}</table></div>${r.note ? `<p class="d-note">${esc(r.note)}</p>` : ""}`;
    }
    return esc(r.value).replace(/\n/g, "<br>");
  }
  function html(m) {
    const meta = m.meta.map(([k, v]) => `<div class="d-meta__i"><span>${esc(k)}</span><b>${esc(v) || "—"}</b></div>`).join("");
    const secs = m.sections.map((s) => `
      <section class="d-sec">
        <div class="d-band"><span class="d-num">${esc(s.num)}</span><span class="d-st">${esc(s.title)}</span></div>
        <table class="d-tbl">${s.rows.map((r) => `<tr><th>${esc(r.label)}</th><td>${cell(r)}</td></tr>`).join("")}</table>
      </section>`).join("");
    const gaps = m.gaps.length
      ? `<ul class="d-gaps">${m.gaps.map((g) => `<li>☐ ${esc(g)}</li>`).join("")}</ul>`
      : `<p>Все обязательные поля заполнены.</p>`;
    return `<article class="d">
      <header class="d-head">
        <div class="d-brand">Дела <i>полетели</i></div>
        <div class="d-kind">${esc(m.kicker)}</div>
        <h2 class="d-title">${esc(m.title)}</h2>
        <div class="d-meta">${meta}</div>
      </header>
      ${secs}
      <section class="d-sec"><div class="d-band d-band--acc"><span class="d-num">✓</span><span class="d-st">${esc(m.gapsTitle || "Что уточнить у клиента")}</span></div>${gaps}</section>
      <footer class="d-foot">${esc(m.footer)}</footer>
    </article>`;
  }

  // ---------- Word (.docx) через библиотеку docx (глобальный window.docx)
  // Линейная вёрстка без таблиц: телефонные просмотрщики Word ломают таблицы,
  // а абзацы читаются одинаково на телефоне и компьютере.
  async function docx(m) {
    const D = window.docx; if (!D) throw new Error("docx library not loaded");
    const { Document, Packer, Paragraph, TextRun, ShadingType, BorderStyle } = D;
    const F = "Arial";
    const run = (text, o = {}) => new TextRun({ text: String(text ?? ""), font: F, size: o.size || 22, bold: o.bold, italics: o.italics, color: o.color || INK });
    const p = (runs, o = {}) => new Paragraph({ children: Array.isArray(runs) ? runs : [runs],
      spacing: { before: o.before || 0, after: o.after ?? 80, line: o.line || 300 }, keepNext: o.keepNext,
      shading: o.fill ? { type: ShadingType.CLEAR, color: "auto", fill: o.fill } : undefined,
      border: o.rule ? { bottom: { style: BorderStyle.SINGLE, size: 4, color: LINE, space: 6 } } : undefined,
      indent: o.indent ? { left: o.indent } : undefined });

    const answer = (r) => {
      if (r.kind === "missing") return [p(run("не заполнено", { color: ACC, italics: true }), { rule: true, after: 160 })];
      if (r.kind === "choice") return r.value.map((v, i) => p([run("☒  ", { color: ACC }), run(v)], { after: i === r.value.length - 1 ? 160 : 40, rule: i === r.value.length - 1 }));
      if (r.kind === "table") {
        const out = r.rows.map((row) => p(row.flatMap((v, i) => [
          run((i ? "   ·   " : "•  ") + r.columns[i] + ": ", { color: MUTED, size: 20 }), run(v || "—", { size: 22 })]), { after: 60, indent: 0 }));
        if (r.note) out.push(p(run(r.note, { italics: true }), { after: 60 }));
        out.push(p(run(""), { rule: true, after: 160 }));
        return out;
      }
      const lines = String(r.value).split("\n");
      return lines.map((l, i) => p(run(l), { after: i === lines.length - 1 ? 160 : 40, rule: i === lines.length - 1 }));
    };
    const band = (num, title, fill) => p([run(` ${num}   `, { bold: true, size: 26, color: fill === INK ? ACC : "FFFFFF" }),
      run(title.toUpperCase() + " ", { bold: true, size: 22, color: "FFFFFF" })], { fill, before: 320, after: 200, line: 360, keepNext: true });

    const children = [
      p([run("ДЕЛА ", { bold: true, size: 24 }), run("полетели", { italics: true, bold: true, size: 24, color: ACC })], { after: 280 }),
      p(run(m.kicker.toUpperCase(), { size: 16, color: MUTED, bold: true }), { after: 60 }),
      p(run(m.title, { bold: true, size: 40 }), { after: 200, line: 400 }),
      ...m.meta.map(([k, v]) => p([run(k + ":  ", { color: MUTED, size: 20 }), run(v || "—", { bold: true })], { after: 40, fill: PAPER })),
      ...m.sections.flatMap((s) => [band(s.num, s.title, INK),
        ...s.rows.flatMap((r) => [p(run(r.label, { bold: true, size: 20, color: MUTED }), { after: 60, keepNext: true }), ...answer(r)])]),
      band("✓", m.gapsTitle || "Что уточнить у клиента", ACC),
      ...(m.gaps.length ? m.gaps.map((g) => p([run("☐  ", { color: ACC }), run(g)], { after: 60 })) : [p(run("Все обязательные поля заполнены."))]),
      p(run(m.footer, { size: 16, color: MUTED }), { before: 360 }),
    ];
    const doc = new Document({ creator: "Дела полетели", title: m.title,
      styles: { default: { document: { run: { font: F, size: 22 } } } },
      sections: [{ properties: { page: { margin: { top: 900, bottom: 900, left: 900, right: 900 } } }, children }] });
    return Packer.toBlob(doc);
  }

  window.BriefDoc = { html, docx };
})();

</script>
<script>
/* Онлайн-бриф «Дела полетели»: анкета из шаблона + голосовые ответы.
   Никаких внешних библиотек и запросов — только свой сервер. */
(() => {
  "use strict";
  // DEMO: страница без сервера (claude.ai) — ответы в браузере, голос через диктовку
  const DEMO = window.BRIEF_DEMO || null;
  const token = DEMO ? "demo" : location.pathname.split("/").filter(Boolean)[1];
  let DICT = null; // диктовка claude.ai (только в DEMO)
  // Клиентская ссылка без сервера: …#agent — сразу нужный бриф, без экрана студии
  const CLIENT = DEMO ? (location.hash || "").replace("#", "") : "";
  const STANDALONE = !!(DEMO && DEMO.standalone); // отдельный сайт (GitHub Pages): без диктовки claude.ai
  const FOR_CLIENT = !!CLIENT || STANDALONE; // публичный сайт: клиентские экраны всегда
  const api = (p) => `/api/${p}/${token}`;
  const LS = `dela_brief_${token}`;
  const MAX_REC_SEC = 15 * 60;

  let T, S, step = -1; // step: -1 обложка, 0..n-1 разделы, n итог

  // Тема: светлая по умолчанию, тёмная, как в системе. Своё имя атрибута, чтобы не спорить с хостом.
  const LOOKS = [["light", "Светлая"], ["dark", "Тёмная"], ["system", "Как в системе"]];
  let look = "light"; try { look = localStorage.getItem("dela_look") || "light"; } catch (e) {}
  const applyLook = () => {
    document.documentElement.setAttribute("data-look", look);
    const b = document.getElementById("look"); if (b) b.textContent = `Тема: ${(LOOKS.find((x) => x[0] === look) || LOOKS[0])[1].toLowerCase()}`;
  };
  (() => {
    const b = document.createElement("button"); b.id = "look"; b.type = "button"; b.className = "look";
    b.setAttribute("aria-label", "Сменить тему оформления");
    b.addEventListener("click", () => {
      look = LOOKS[(LOOKS.findIndex((x) => x[0] === look) + 1) % LOOKS.length][0];
      try { localStorage.setItem("dela_look", look); } catch (e) {}
      applyLook();
    });
    (document.querySelector(".top__right") || document.querySelector(".top")).append(b);
    applyLook();
  })();
  const app = document.getElementById("app");
  const saveEl = document.getElementById("save");

  // ---------- утилиты
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
    return el;
  };
  const pad = (n) => String(n).padStart(2, "0");
  const fmtT = (s) => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
  const A = () => S.answers;

  let toastTimer = null;
  function toast(msg) { // вместо alert(): в некоторых окнах alert не показывается
    let el = document.getElementById("toast");
    if (!el) { el = h("div", { id: "toast", class: "toast", role: "status" }); document.body.append(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
  }

  function mdLite(src) { // абзацы, нумерованный список, **жирный**
    const box = h("div");
    let ol = null;
    for (const line of src.split("\n")) {
      const t = line.trim();
      if (!t) { ol = null; continue; }
      const m = t.match(/^\d+\.\s+(.*)/);
      const node = m ? h("li") : h("p");
      (m ? m[1] : t).split(/\*\*(.+?)\*\*/).forEach((part, i) =>
        node.append(i % 2 ? h("strong", { text: part }) : document.createTextNode(part)));
      if (m) { if (!ol) { ol = h("ol"); box.append(ol); } ol.append(node); }
      else { ol = null; box.append(node); }
    }
    return box;
  }

  // ---------- сохранение
  let saveTimer = null;
  function save(now = false) {
    try {
      localStorage.setItem(LS, JSON.stringify(S.answers));
      if (DEMO) localStorage.setItem(LS + "_state", JSON.stringify({ answers: S.answers, consent: S.consent, segment: S.segment }));
    } catch (e) { /* приватный режим */ }
    clearTimeout(saveTimer);
    saveEl.textContent = "Сохраняем…";
    saveTimer = setTimeout(push, now ? 0 : 700);
    updateProgress();
  }
  async function push(kind = "save") {
    if (DEMO) { saveEl.textContent = "Сохранено в этом браузере"; return true; }
    try {
      const r = await fetch(api(kind), { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answers: S.answers, consent: S.consent }) });
      if (!r.ok) throw new Error(r.status);
      const t = new Date();
      saveEl.textContent = `Сохранено ${pad(t.getHours())}:${pad(t.getMinutes())}`;
      return true;
    } catch (e) {
      saveEl.textContent = "Нет связи — ответы сохранены на этом устройстве";
      return false;
    }
  }

  // ---------- логика вопросов
  const visible = (q) => {
    const c = q.show_if; if (!c) return true;
    const v = A()[c.q]; const vals = Array.isArray(v) ? v : [v];
    return c.any.some((x) => vals.includes(x));
  };
  const filled = (q) => {
    if ((S.audio[q.id] || []).length) return true;
    const v = A()[q.id];
    if (q.type === "table") return (v || []).some((r) => Object.values(r || {}).some((c) => String(c).trim()));
    if (q.type === "scale") return !!v && Object.keys(v).length > 0;
    if (Array.isArray(v)) return v.length > 0;
    return !!String(v ?? "").trim();
  };
  const SECS = () => T.sections.filter(visible); // разделы тоже могут иметь show_if
  const reqOf = (sec) => sec.questions.filter((q) => q.required && visible(q));
  function updateProgress() {
    const all = SECS().flatMap(reqOf);
    const done = all.filter(filled).length;
    document.getElementById("bar").style.width = `${all.length ? (done / all.length) * 100 : 0}%`;
  }

  // ---------- голос
  const voiceOK = !!(window.isSecureContext && navigator.mediaDevices && window.MediaRecorder);
  let deviceId = null; try { deviceId = localStorage.getItem("dela_mic"); } catch (e) {}
  const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  let active = null; // текущая запись (одна на страницу)

  function pickMime() {
    const list = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus", "audio/webm"];
    return list.find((m) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
  }

  async function fillDevices(sel, box) {
    try {
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
      if (devs.length < 2) return;
      sel.replaceChildren(...devs.map((d, i) => h("option", { value: d.deviceId, text: d.label || `Микрофон ${i + 1}` })));
      if (deviceId && devs.some((d) => d.deviceId === deviceId)) sel.value = deviceId;
      box.classList.add("is-on");
    } catch (e) {}
  }

  // Диктовка: речь сразу становится текстом в поле (режим DEMO на claude.ai)
  let dictTarget = null, dictBtn = null, dictBase = "";
  function dictBlock(target, prompt) {
    if (!DICT || !target) return h("div", { class: "voice" }, h("p", { class: "novoice",
      text: CLIENT || STANDALONE ? "Голосовой ввод здесь недоступен — ответьте текстом, можно коротко." : "Голосовой ввод в демо работает в Chrome, Edge или Яндекс Браузере на компьютере. Здесь — ответьте текстом." }));
    const btn = h("button", { class: "mic", type: "button" });
    const set = (on) => { btn.innerHTML = on ? '<span class="dot">●</span> Остановить' : `${MIC} Ответить голосом`; btn.classList.toggle("is-rec", on); };
    set(false);
    btn.addEventListener("click", () => {
      if (dictBtn === btn) { DICT.stop().catch(() => {}); return; }
      if (dictBtn) DICT.stop().catch(() => {});
      dictTarget = target; dictBtn = btn; dictBase = target.value ? target.value.replace(/\s*$/, " ") : "";
      DICT.start().catch((e) => {
        dictTarget = dictBtn = null; set(false);
        toast(e && e.code === "not_granted" ? "Микрофон не разрешён — ответьте текстом." : "Не удалось включить микрофон. Попробуйте ещё раз.");
      });
      set(true);
    });
    btn._set = set;
    return h("div", { class: "voice" }, h("div", { class: "voice__row" }, btn,
      h("span", { class: "voice__prompt", text: prompt || "Говорите — текст появится в поле, его можно поправить" })));
  }
  function bindDictation() {
    if (!DICT) return;
    const write = (txt) => { if (!dictTarget) return; dictTarget.value = txt; dictTarget.dispatchEvent(new Event("input")); };
    DICT.onPartial(({ text }) => write(dictBase + text));
    DICT.onFinal(({ text }) => { dictBase = (dictBase + text).replace(/\s*$/, " "); write(dictBase); });
    DICT.onState(({ state }) => { if (state === "idle" && dictBtn) { dictBtn._set(false); dictBtn = dictTarget = null; } });
  }

  function voiceBlock(qid, prompt, target) {
    const recs = h("ul", { class: "recs" });
    const renderRecs = () => {
      recs.replaceChildren(...(S.audio[qid] || []).map((a) => h("li", { class: "rec" },
        h("audio", { controls: true, preload: "none", src: `/api/audio/${token}/${a.file}` }),
        h("span", { class: "rec__t", text: fmtT(a.dur || 0) }),
        h("button", { class: "linkbtn", type: "button", "aria-label": "Удалить запись", text: "Удалить",
          onclick: async (e) => {
            const b = e.currentTarget;
            if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Точно удалить?"; return; }
            const r = await fetch(`${api("audio")}?q=${qid}&action=delete&f=${encodeURIComponent(a.file)}`, { method: "POST" });
            if (r.ok) { S.audio[qid] = (await r.json()).audio; renderRecs(); updateProgress(); }
          } }))));
    };
    renderRecs();
    if (DEMO) return dictBlock(target, prompt);
    if (!voiceOK) {
      return h("div", { class: "voice" }, recs, h("p", { class: "novoice",
        text: "Голосовой ответ недоступен в этом браузере — напишите текстом или откройте ссылку в Chrome/Safari на телефоне." }));
    }
    const btn = h("button", { class: "mic", type: "button" });
    const setBtn = (rec) => { btn.innerHTML = rec ? '<span class="dot">●</span> Остановить' : `${MIC} Ответить голосом`; btn.classList.toggle("is-rec", rec); };
    setBtn(false);
    const canvas = h("canvas", { width: 320, height: 64 });
    const timer = h("span", { class: "timer", text: "0:00" });
    const sel = h("select", { "aria-label": "Выбор микрофона", onchange: () => { deviceId = sel.value; try { localStorage.setItem("dela_mic", deviceId); } catch (e) {} } });
    const devBox = h("label", { class: "devices" }, "Микрофон:", sel);
    const box = h("div", { class: "voice" },
      h("div", { class: "voice__row" }, btn, prompt ? h("span", { class: "voice__prompt", text: prompt }) : null),
      h("div", { class: "voice__live" }, timer, canvas, h("span", { class: "voice__prompt", text: "Говорите — запись идёт" })),
      devBox, recs);
    if (deviceId) fillDevices(sel, devBox);

    btn.addEventListener("click", async () => {
      if (active && active.qid === qid) return active.stop();
      if (active) active.stop();
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: deviceId ? { deviceId: { exact: deviceId } } : true });
      } catch (e) {
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch (e2) { toast("Нет доступа к микрофону. Разрешите его в настройках браузера или ответьте текстом."); return; }
      }
      fillDevices(sel, devBox);
      const mime = pickMime();
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      const chunks = []; const t0 = Date.now();
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      // индикатор уровня
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const an = ctx.createAnalyser(); an.fftSize = 256;
      ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.frequencyBinCount); const g = canvas.getContext("2d");
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
      let raf;
      const draw = () => {
        an.getByteTimeDomainData(buf);
        const sec = (Date.now() - t0) / 1000; timer.textContent = fmtT(sec);
        if (sec > MAX_REC_SEC) return active && active.stop();
        g.clearRect(0, 0, canvas.width, canvas.height); g.fillStyle = accent;
        const bars = 40;
        for (let i = 0; i < bars; i++) {
          let peak = 0; const step = Math.floor(buf.length / bars);
          for (let j = 0; j < step; j++) peak = Math.max(peak, Math.abs(buf[i * step + j] - 128));
          const bh = Math.max(3, (peak / 128) * canvas.height * 1.6);
          g.fillRect(i * 8, (canvas.height - bh) / 2, 5, Math.min(bh, canvas.height));
        }
        raf = requestAnimationFrame(draw);
      };
      rec.onstop = async () => {
        cancelAnimationFrame(raf); ctx.close(); stream.getTracks().forEach((t) => t.stop());
        box.classList.remove("is-rec"); setBtn(false); active = null;
        const dur = (Date.now() - t0) / 1000;
        if (dur < 1) return;
        const blob = new Blob(chunks, { type: (rec.mimeType || mime || "audio/webm").split(";")[0] });
        await upload(qid, blob, dur, recs, renderRecs);
      };
      rec.start(1000);
      active = { qid, stop: () => rec.state !== "inactive" && rec.stop() };
      box.classList.add("is-rec"); setBtn(true); draw();
    });
    return box;
  }

  async function upload(qid, blob, dur, recs, renderRecs) {
    const li = h("li", { class: "rec" }, h("span", { class: "rec__t", text: `Загружаем запись ${fmtT(dur)}…` }));
    recs.append(li);
    try {
      const r = await fetch(`${api("audio")}?q=${qid}&dur=${dur.toFixed(1)}`, { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
      if (!r.ok) throw new Error(r.status);
      S.audio[qid] = (await r.json()).audio; renderRecs(); updateProgress();
    } catch (e) {
      li.replaceChildren(h("span", { class: "rec__err", text: "Запись не загрузилась." }),
        h("button", { class: "linkbtn", type: "button", text: "Повторить", onclick: () => { li.remove(); upload(qid, blob, dur, recs, renderRecs); } }),
        h("a", { class: "linkbtn", href: URL.createObjectURL(blob), download: `${qid}.${blob.type.includes("mp4") ? "m4a" : "webm"}`, text: "Сохранить файл" }));
    }
  }

  // ---------- поля
  function choice(q, multi) {
    const opts = [...q.options, ...(q.other ? ["__other"] : [])];
    const cur = () => { const v = A()[q.id]; return multi ? (Array.isArray(v) ? v : []) : v; };
    const other = h("input", { type: "text", class: "other", placeholder: "Уточните", value: A()[`${q.id}__other`] || "",
      oninput: (e) => { A()[`${q.id}__other`] = e.target.value; save(); } });
    const chips = h("div", { class: "chips", role: multi ? "group" : "radiogroup" });
    const sync = () => {
      const c = cur();
      [...chips.children].forEach((b) => b.setAttribute("aria-pressed", multi ? c.includes(b.dataset.v) : c === b.dataset.v));
      other.style.display = (multi ? c.includes("__other") : c === "__other") ? "" : "none";
    };
    opts.forEach((o) => chips.append(h("button", { type: "button", class: "chip", "data-v": o, text: o === "__other" ? "Другое" : o,
      onclick: () => {
        if (multi) { const c = cur().slice(); const i = c.indexOf(o); i < 0 ? c.push(o) : c.splice(i, 1); A()[q.id] = c; }

  let DL = null; // downloads claude.ai (только в DEMO)
  let FULL = null; // полный шаблон со всеми сегментами (DEMO)
  function segTemplate(full, seg) { // то же, что brief.py segment_template
    const t = JSON.parse(JSON.stringify(full)); const info = t.segments[seg]; delete t.segments;
    Object.assign(t, info, { segment: seg });
    const ok = (x) => !x.only || x.only.includes(seg);
    t.sections = t.sections.filter(ok).map((sec) => ({ ...sec, title: (sec.titles || {})[seg] || sec.title, questions: sec.questions.filter(ok) })).filter((sec) => sec.questions.length);
    return t;
  }
  function switcher() { // демо: в шапке всегда можно вернуться к выбору брифа
    let b = document.getElementById("switch");
    if (!b) { b = h("button", { id: "switch", class: "switch", type: "button", onclick: () => { if (active) active.stop(); picker(); window.scrollTo(0, 0); } }); (document.querySelector(".top__right") || document.querySelector(".top")).append(b); }
    b.textContent = STANDALONE ? "Сменить бриф" : S.segment ? `${(FULL.segments[S.segment] || {}).short || "Бриф"} · сменить` : "Выбрать бриф";
  }
  function picker() { // экран студии: какой бриф отправить клиенту
    document.querySelector(".nav")?.remove();
    setTimeout(switcher, 0);
    app.replaceChildren(h("section", { class: "hero hero--short" },
      h("p", { class: "hero__eyebrow", text: STANDALONE ? "Студия «Дела полетели»" : "Экран студии · клиент его не видит" }),
      h("h1", { text: STANDALONE ? "Какой бриф вам нужен?" : "Какой бриф отправить клиенту?" }),
      h("p", { class: "hero__sub", text: STANDALONE ? "Выберите, что хотите заказать, — покажем только нужные вопросы." : "Клиенту отправляйте ссылку на эту страницу с пометкой брифа в конце, например …#agent: он сразу попадёт в свой бриф, без этого экрана." })),
      h("div", { class: "segs" }, ...Object.entries(FULL.segments).map(([k, v]) => {
        const qs = segTemplate(FULL, k).sections.flatMap((s2) => s2.questions); const n = qs.length; const r = qs.filter((q) => q.required).length;
        const idx = Object.keys(FULL.segments).indexOf(k) + 1;
        return h("button", { type: "button", class: "segcard", onclick: () => {
          if (S.segment !== k) { S.answers = {}; S.consent = null; }
          S.segment = k; T = segTemplate(FULL, k); save(true); step = -1; render(); switcher(); window.scrollTo(0, 0);
        } }, h("span", { class: "segcard__n", text: `ДП-${pad(idx)}` }), h("b", { text: v.title }), h("span", { text: v.subtitle }), h("i", {}, `${v.minutes} мин`, h("br"), `${r} главных из ${n}`, STANDALONE ? null : h("br"), STANDALONE ? null : h("code", { class: "segcard__hash", text: `#${k}` })));
      })));
  }
  if (DEMO) window.BriefDemoModel = () => docModel(); // для проверки сборки документа
  function modelText(m) { // ответы простым текстом — для мессенджера: вопрос, под ним ответ
    const L = [m.title.toUpperCase(), ...m.meta.filter(([, v]) => v).map(([k, v]) => `${k}: ${v}`), ""];
    for (const sec of m.sections) {
      L.push(`━━ ${sec.num}. ${sec.title.toUpperCase()} ━━`, "");
      for (const r of sec.rows) {
        L.push(`▸ ${r.label}`);
        if (r.kind === "missing") L.push("  — не заполнено");
        else if (r.kind === "choice") r.value.forEach((v) => L.push(`  ✓ ${v}`));
        else if (r.kind === "table") { r.rows.forEach((row) => L.push("  • " + row.map((c, i) => `${r.columns[i]}: ${c || "—"}`).join(" · "))); if (r.note) L.push(`  ${r.note}`); }
        else String(r.value).split("\n").forEach((l) => L.push(`  ${l}`));
        L.push("");
      }
    }
    return L.join("\n");
  }

  function done() {
    document.querySelector(".nav")?.remove();
    if (DEMO) {
      const m = docModel();
      const wrap = h("div", { class: "docwrap" }); wrap.innerHTML = window.BriefDoc.html(m); // все значения экранированы в doc.js
      const TR = { а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "e", ж: "zh", з: "z", и: "i", й: "y", к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f", х: "h", ц: "ts", ч: "ch", ш: "sh", щ: "sch", ъ: "", ы: "y", ь: "", э: "e", ю: "yu", я: "ya" };
      const slug = (A().company_name || "client").toLowerCase().split("").map((c) => TR[c] ?? c).join("").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40) || "client";
      const fname = `brief_${slug}.docx`; // латиницей: кириллица в имени скачивания ломается в части браузеров
      const canSave = !!window.docx && (DL || STANDALONE);
      const dlBtn = canSave ? h("button", { class: "btn btn--accent", type: "button", text: "Скачать Word (.docx)", onclick: async (e) => {
        const b = e.currentTarget; b.disabled = true; b.textContent = "Собираем документ…";
        try {
          const blob = await window.BriefDoc.docx(m);
          if (DL) await DL.save({ filename: fname, data: blob });
          else { const u = URL.createObjectURL(blob); const a = h("a", { href: u, download: fname }); document.body.append(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 4000); }
          b.textContent = "Скачано";
        } catch (er) {
          b.textContent = "Скачать Word (.docx)";
          if (!er || er.code !== "declined") toast("Не получилось сохранить файл здесь. Откройте страницу в браузере на компьютере.");
        } finally { b.disabled = false; }
      } }) : null;
      const copyBtn = h("button", { class: "btn", type: "button", text: "Скопировать ответы текстом", onclick: (e) => {
        const b = e.currentTarget; const txt = modelText(m);
        navigator.clipboard.writeText(txt).then(() => { b.textContent = "Скопировано — вставьте в сообщение"; },
          () => { toast("Не удалось скопировать. Скачайте документ или выделите текст ниже."); });
      } });
      if (FOR_CLIENT) {
        // меню «Поделиться» телефона: файл собираем заранее, иначе браузер не даст открыть меню
        const shareBtn = h("button", { class: "btn btn--accent", type: "button", text: "Отправить в Telegram / WhatsApp", hidden: true });
        let shareFile = null;
        if (navigator.canShare && window.docx) {
          window.BriefDoc.docx(m).then((blob) => {
            const f = new File([blob], fname, { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
            if (navigator.canShare({ files: [f] })) { shareFile = f; shareBtn.hidden = false; }
          }).catch(() => {});
        }
        shareBtn.addEventListener("click", () => {
          if (!shareFile) return;
          navigator.share({ files: [shareFile], title: m.title, text: m.title }).then(() => { shareBtn.textContent = "Отправлено"; })
            .catch((er) => { if (er && er.name !== "AbortError") toast("Не получилось открыть меню отправки. Скачайте документ и отправьте его вручную."); });
        });
        if (dlBtn) dlBtn.className = "btn";
        app.replaceChildren(h("section", { class: "hero hero--short" },
          h("p", { class: "hero__eyebrow", text: "Бриф заполнен" }),
          h("h1", { text: "Осталось отправить нам" }),
          h("p", { class: "hero__sub", text: "Отправьте документ вашему менеджеру в Telegram, WhatsApp или на почту. Ниже — как он выглядит." }),
          T.contacts ? h("p", { class: "demo", text: T.contacts }) : null,
          h("div", { class: "done__btns" }, shareBtn, dlBtn, copyBtn, h("button", { class: "btn", type: "button", text: "Вернуться к ответам", onclick: () => go(0) }))),
          wrap);
        return;
      }
      app.replaceChildren(h("section", { class: "hero hero--short" },
        h("p", { class: "hero__eyebrow", text: "Бриф отправлен" }),
        h("h1", { text: "Так его получит студия" }),
        h("p", { class: "hero__sub", text: "Документ собирается автоматически. Красным отмечено то, что менеджер уточнит у клиента. В Word его можно сохранить в PDF." }),
        h("div", { class: "done__btns" }, dlBtn, copyBtn,
          h("button", { class: "btn", type: "button", text: "Вернуться к ответам", onclick: () => go(0) }),
          h("button", { class: "btn", type: "button", text: "Другой бриф", onclick: (e) => {
            const b = e.currentTarget;
            if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Стереть ответы и выбрать заново?"; return; }
            try { localStorage.removeItem(LS); localStorage.removeItem(LS + "_state"); } catch (er) {}
            S.answers = {}; S.consent = null; S.segment = null; step = -1; picker(); window.scrollTo(0, 0);
          } }))),
        wrap);
      return;
    }
    app.replaceChildren(h("section", { class: "hero hero--short" },
      h("p", { class: "hero__eyebrow", text: "Бриф отправлен" }),
      h("h1", { text: "Спасибо, бриф у нас" }),
      h("p", { class: "hero__sub", text: "Мы прослушаем записи, разберём ответы и вернёмся с уточняющими вопросами. Вспомните что-то ещё — откройте эту же ссылку и дополните." }),
      h("button", { class: "btn", type: "button", text: "Вернуться к ответам", onclick: () => go(0) })));
  }

  function render() {
    if (step < 0) cover(); else if (step >= SECS().length) summary(); else section();
    updateProgress();
  }

  // ---------- старт
  const load = DEMO
    ? Promise.resolve({ template: DEMO.template, privacy: DEMO.privacy, client: null,
        state: (() => { try { return JSON.parse(localStorage.getItem(LS + "_state") || "null") || {}; } catch (e) { return {}; } })() })
    : fetch(`/api/form/${token}`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  if (DEMO && window.claude && window.claude.use) {
    window.claude.use("dictation").then((d) => { DICT = d; bindDictation(); if (step >= 0 && step < SECS().length) render(); }).catch(() => {});
    window.claude.use("downloads").then((d) => { DL = d; }).catch(() => {});
  }
  load.then((d) => {
    T = d.template;
    const st = d.state || {};
    S = { answers: st.answers || {}, audio: st.audio || {}, consent: st.consent || null, status: st.status, client: d.client, privacy: d.privacy, segment: st.segment || null };
    try { // если сервер не успел получить последние правки — берём локальную копию
      const local = JSON.parse(localStorage.getItem(LS) || "null");
      if (local && Object.keys(local).length > Object.keys(S.answers).length) { S.answers = local; save(true); }
    } catch (e) {}
    if (!DEMO) document.title = `${T.title} · Дела полетели`;
    if (DEMO && T.segments) {
      FULL = T;
      if (CLIENT && FULL.segments[CLIENT]) { // клиентская ссылка: свой бриф, без экрана студии
        if (S.segment !== CLIENT) { S.answers = {}; S.consent = null; }
        S.segment = CLIENT; T = segTemplate(FULL, CLIENT); render(); return;
      }
      if (!S.segment || !FULL.segments[S.segment]) { T = segTemplate(FULL, Object.keys(FULL.segments)[0]); picker(); switcher(); return; }
      T = segTemplate(FULL, S.segment); switcher();
    }
    render();
  }).catch(() => { app.replaceChildren(h("p", { class: "loading", text: "Ссылка не найдена или устарела. Напишите вашему менеджеру." })); });

  window.addEventListener("beforeunload", () => { if (!DEMO && S && S.consent) navigator.sendBeacon?.(api("save"), new Blob([JSON.stringify({ answers: S.answers, consent: S.consent })], { type: "application/json" })); });
})();

</script>
</body>
</html>
